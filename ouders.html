<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voor ouders · Lezen met Kaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf5e8; --kaart: #fffdf8; --inkt: #3d3128; --zacht: #6d5c4d; --rand: #e6d7bf;
    --groen: #2f9e6e; --groen-licht: #dff3e8; --oranje: #e08a22; --oranje-licht: #fdeed8;
    --rood: #d9534f; --rood-licht: #fbe3e2; --accent: #3d3128; --leeg: #f3ead9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a16; --kaart: #2a241f; --inkt: #f3e9dc; --zacht: #bfae9b; --rand: #40372f;
      --groen: #5cc795; --groen-licht: #1f3a2d; --oranje: #f0a64b; --oranje-licht: #3d2f1c;
      --rood: #ef7c78; --rood-licht: #432523; --accent: #f3e9dc; --leeg: #332c26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--inkt); font: 16px/1.5 'Nunito', system-ui, sans-serif; }
  h1, h2 { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; line-height: 1.15; margin: 0; }
  h1 { font-size: 1.7rem; }
  h2 { font-size: 1.25rem; margin-bottom: .6rem; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sub { color: var(--zacht); font-size: .9rem; }
  button, select, input { font: inherit; color: inherit; }
  .knop { background: var(--kaart); border: 1.5px solid var(--rand); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .knop:hover { border-color: var(--zacht); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { background: var(--kaart); border: 1.5px solid var(--rand); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
  .tab[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .tab small { font-weight: 400; opacity: .75; }
  .balk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  select { background: var(--kaart); border: 1.5px solid var(--rand); border-radius: 10px; padding: 5px 10px; }
  .kaart { background: var(--kaart); border: 1.5px solid var(--rand); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .cijfers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .cijfer { background: var(--kaart); border: 1.5px solid var(--rand); border-radius: 16px; padding: 12px 14px; }
  .cijfer b { display: block; font-family: 'Baloo 2', sans-serif; font-size: 1.7rem; line-height: 1.1; }
  .cijfer span { color: var(--zacht); font-size: .85rem; }
  .goed { color: var(--groen); } .fout { color: var(--rood); }
  .rooster-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 6px 6px; text-align: left; border-bottom: 1px solid var(--rand); vertical-align: top; }
  th { font-weight: 700; color: var(--zacht); font-size: .8rem; }
  .rooster td.cel { text-align: center; white-space: nowrap; border-radius: 8px; }
  .rooster th.kop { text-align: center; }
  .cel.hoog { background: var(--groen-licht); color: var(--groen); font-weight: 700; }
  .cel.midden { background: var(--oranje-licht); color: var(--oranje); font-weight: 700; }
  .cel.laag { background: var(--rood-licht); color: var(--rood); font-weight: 700; }
  .cel.leeg { color: var(--zacht); opacity: .5; }
  .cel.info { font-weight: 600; }
  .rooster td:first-child, #dagen td:first-child { white-space: nowrap; }
  tr.vandaag td:first-child { font-weight: 700; }
  .staaf { display: grid; grid-template-columns: 11rem 1fr 6.5rem; gap: 10px; align-items: center; margin: 7px 0; font-size: .92rem; }
  .staaf .spoor { height: 12px; background: var(--leeg); border-radius: 99px; overflow: hidden; }
  .staaf .vul { display: block; height: 100%; border-radius: 99px; background: var(--groen); }
  .staaf .vul.midden { background: var(--oranje); } .staaf .vul.laag { background: var(--rood); }
  .staaf .getal { text-align: right; color: var(--zacht); }
  .fouten { list-style: none; margin: 0; padding: 0; }
  .fouten li { border-top: 1px solid var(--rand); padding: 10px 0; }
  .fouten li:first-child { border-top: 0; }
  .fouten .wat { font-size: .8rem; color: var(--zacht); }
  .fouten .vraag { margin: 2px 0 4px; }
  .fouten .paar { display: flex; gap: 14px; flex-wrap: wrap; font-size: .92rem; }
  .fouten .paar s { text-decoration-color: var(--rood); }
  .leeg-bericht { color: var(--zacht); text-align: center; padding: 20px 0; }
  .inlog { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .inlog input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--rand); background: var(--kaart); margin: 14px 0 10px; text-align: center; font-size: 1.1rem; }
  .inlog .knop { padding: 9px 22px; font-weight: 700; background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .melding { color: var(--rood); min-height: 1.5em; }
  .meer { margin-top: 10px; }
  .figuren .tab { font-weight: 600; padding: 4px 12px; font-size: .9rem; }
  .inlog input + input { margin-top: 0; }
  .beheer-kop { margin: 28px 0 12px; font-size: 1.5rem; }
  .beheer-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .beheer-form input, .gezin input { padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--rand); background: var(--kaart); }
  .beheer-form input[name="kinderen"] { grid-column: 1 / -1; }
  .beheer-form .knop { justify-self: start; font-weight: 700; }
  .uitkomst { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--groen-licht); }
  .uitkomst code, .gezin code { font-size: 1rem; font-weight: 700; user-select: all; }
  .gezin { border-top: 1px solid var(--rand); padding: 12px 0; }
  .gezin:first-child { border-top: 0; }
  .gezin .regel { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 4px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--leeg); border-radius: 99px; padding: 2px 4px 2px 10px; }
  .chip button, .klein-knop { border: 0; background: none; cursor: pointer; color: var(--zacht); font: inherit; padding: 2px 6px; border-radius: 99px; }
  .klein-knop { border: 1.5px solid var(--rand); padding: 3px 10px; font-size: .85rem; background: var(--kaart); }
  .klein-knop.gevaar { color: var(--rood); }
  #los select { max-width: 14rem; }
  @media (max-width: 640px) {
    .beheer-form { grid-template-columns: 1fr; }
    .cijfers { grid-template-columns: repeat(2, 1fr); }
    .staaf { grid-template-columns: 7.5rem 1fr 5.5rem; font-size: .85rem; }
    th, td { padding: 5px 4px; }
    .rooster .kop-woord { display: none; }
    .rooster th.kop { font-size: 1.1rem; }
    .rooster td { font-size: .8rem; }
  }
</style>
</head>
<body>
<main>
  <section id="inlog" class="inlog" hidden>
    <h1>Voor ouders</h1>
    <p class="sub">Log in om te zien wat je kinderen geoefend hebben.</p>
    <form id="inlog-form">
      <input id="gebruiker" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Gebruikersnaam" aria-label="Gebruikersnaam">
      <input id="wachtwoord" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord">
      <button class="knop" type="submit">Inloggen</button>
    </form>
    <p class="melding" id="melding"></p>
  </section>

  <section id="overzicht" hidden>
    <header>
      <div>
        <h1>Wat is er geoefend?</h1>
        <p class="sub" id="bijgewerkt"></p>
        <p class="sub" id="koppelcode"></p>
      </div>
      <div class="balk" style="margin:0">
        <button class="knop" id="ververs" type="button">↻ Ververs</button>
        <button class="knop" id="uitloggen" type="button">Uitloggen</button>
      </div>
    </header>

    <div class="tabs" id="kinderen"></div>
    <div class="tabs figuren" id="tabs"></div>
    <div class="balk">
      <label for="periode" class="sub">Periode</label>
      <select id="periode">
        <option value="1">Vandaag</option>
        <option value="7">Laatste 7 dagen</option>
        <option value="0" selected>Alles</option>
      </select>
    </div>

    <div class="cijfers" id="cijfers"></div>
    <div id="rooster"></div>
    <div class="kaart"><h2>Per onderdeel</h2><div id="onderdelen"></div></div>
    <div class="kaart"><h2>Per dag</h2><div id="dagen"></div></div>
    <div class="kaart">
      <h2>Wat ging er mis?</h2>
      <div class="balk"><select id="fout-filter" aria-label="Onderdeel"></select></div>
      <ul class="fouten" id="fouten"></ul>
      <button class="knop meer" id="meer" type="button" hidden>Meer laten zien</button>
    </div>

    <section id="beheer" hidden>
      <h2 class="beheer-kop">Beheer</h2>
      <div class="kaart">
        <h2>Nieuw gezin</h2>
        <form id="gezin-form" class="beheer-form">
          <input name="naam" placeholder="Gezinsnaam, bv. De Vries" aria-label="Gezinsnaam" required>
          <input name="gebruikersnaam" placeholder="Gebruikersnaam ouder, bv. devries" aria-label="Gebruikersnaam" autocapitalize="none" spellcheck="false" required>
          <input name="kinderen" placeholder="Kinderen, met komma's: Emma, Daan" aria-label="Kinderen">
          <button class="knop" type="submit">Aanmaken</button>
        </form>
        <div id="beheer-uitkomst" class="uitkomst" hidden></div>
        <p class="melding" id="beheer-melding"></p>
      </div>
      <div class="kaart"><h2>Gezinnen</h2><div id="gezinnen"></div></div>
      <div class="kaart">
        <h2>Antwoorden zonder kind</h2>
        <p class="sub">Van vóór het koppelen, of van een tablet die niet gekoppeld is. Kies bij wie ze horen.</p>
        <div id="los"></div>
      </div>
    </section>
  </section>
</main>

<script src="mochi.js"></script>
<script>
(() => {
  'use strict';

  const TOKEN = 'lezen-met-kaia:ouders:token';
  const KIND = 'lezen-met-kaia:ouders:figuur';
  const KIND_ID = 'lezen-met-kaia:ouders:kind';
  const LOS = '__los';   // de beheerder: antwoorden die (nog) bij geen kind horen
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const lees = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const schrijf = (k, w) => { try { w === null ? localStorage.removeItem(k) : localStorage.setItem(k, w); } catch (e) { /* geen opslag */ } };

  const FIGUREN = [
    { id: 'mochi', naam: '🐼 Mochi', uitleg: 'toetstraining groep 8' },
    { id: 'kaia', naam: '🦫 Kaia', uitleg: 'groep 8' },
    { id: 'pluis', naam: '🐰 Pluis', uitleg: 'groep 5' }
  ];
  const ONDERDEEL_NAAM = {
    kaia: { lezen: 'Begrijpend lezen', spelling: 'Spelling', taal: 'Taalverzorging', dictee: 'Dictee' },
    pluis: { klank: 'Wortelkeuze', bouw: 'Woordbouwer', flits: 'Flitswoord', luister: 'Luisterwoord', dictee: 'Dictee' },
    mochi: Object.fromEntries(MOCHI.onderdelen.map((o) => [o.id, `${o.emoji} ${o.titel}`]))
  };
  const naamVan = (wie, id) => (ONDERDEEL_NAAM[wie] && ONDERDEEL_NAAM[wie][id]) || id;

  let alles = [];
  let figuur = lees(KIND) || 'mochi';
  let foutenGetoond = 25;
  let info = { rol: 'ouder', kinderen: [] };   // wie is ingelogd, en welke kinderen
  let kindId = lees(KIND_ID);

  /* ---------- Ophalen ---------- */

  async function vraag(pad, opties = {}) {
    const r = await fetch(pad, {
      ...opties,
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${lees(TOKEN) || ''}` }
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const fout = new Error(data.fout || `De server gaf fout ${r.status}.`); fout.status = r.status; throw fout; }
    return data;
  }

  async function laad() {
    if (!lees(TOKEN)) { toonInlog(); return; }
    try {
      const data = await vraag('/api/log');
      info = data;
      alles = bewerk(data.gebeurtenissen || []);
      $('#inlog').hidden = true;
      $('#overzicht').hidden = false;
      $('#bijgewerkt').textContent = `${data.rol === 'beheer' ? 'Beheerder' : `Gezin ${data.naam}`} · bijgewerkt om ${new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`;
      $('#koppelcode').innerHTML = data.code
        ? `Koppelcode voor de tablet van je kind: <b>${esc(data.code)}</b> (eenmalig invullen bij 👤 in de app)`
        : '';
      teken();
      if (data.rol === 'beheer') laadBeheer();
    } catch (e) {
      if (e.status === 401 || e.status === 403) { schrijf(TOKEN, null); toonInlog(e.message); }
      else $('#bijgewerkt').textContent = `Bijwerken lukte niet: ${e.message}`;
    }
  }

  function toonInlog(melding) {
    $('#overzicht').hidden = true;
    $('#inlog').hidden = false;
    $('#melding').textContent = melding || '';
    $('#gebruiker').focus();
  }

  // Een antwoord kan vaker binnenkomen (bij een open vraag mag het kind zijn
  // zelfbeoordeling aanpassen): per sessie + vraag telt alleen de laatste.
  function bewerk(lijst) {
    const per = new Map();
    lijst.sort((a, b) => a.t.localeCompare(b.t)).forEach((g) => {
      const sleutel = g.soort === 'antwoord' ? `a:${g.sessie}:${g.onderdeel}:${g.nr}` : `k:${g.sessie}:${g.id}`;
      per.set(sleutel, g);
    });
    return [...per.values()].sort((a, b) => a.t.localeCompare(b.t));
  }

  /* ---------- Hulpjes ---------- */

  const dagSleutel = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const dagNaam = (s) => new Date(`${s}T12:00:00`).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
  const tijd = (t) => new Date(t).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const pct = (goed, van) => (van ? Math.round((goed / van) * 100) : 0);
  const niveau = (p) => (p >= 80 ? 'hoog' : p >= 55 ? 'midden' : 'laag');
  const punten = (lijst) => lijst.reduce((n, g) => n + (Number(g.punten) || 0), 0);
  const getal = (n) => (Math.round(n * 10) / 10).toLocaleString('nl-NL');

  // Oefentijd: per sessie van het eerste tot het laatste moment, met een
  // pauze-grens zodat een open laten staan app niet als uren oefenen telt.
  function minuten(lijst) {
    const perSessie = new Map();
    lijst.forEach((g) => {
      const t = Date.parse(g.t);
      if (!perSessie.has(g.sessie)) perSessie.set(g.sessie, []);
      perSessie.get(g.sessie).push(t);
    });
    let ms = 0;
    perSessie.forEach((ts) => {
      ts.sort((a, b) => a - b);
      ms += 30000; // het eerste antwoord kost ook tijd
      for (let i = 1; i < ts.length; i++) ms += Math.min(ts[i] - ts[i - 1], 5 * 60000);
    });
    return Math.round(ms / 60000);
  }

  function binnenPeriode(lijst) {
    const dagen = Number($('#periode').value);
    if (!dagen) return lijst;
    const grens = new Date();
    grens.setHours(0, 0, 0, 0);
    grens.setDate(grens.getDate() - (dagen - 1));
    return lijst.filter((g) => Date.parse(g.t) >= grens.getTime());
  }

  /* ---------- Tekenen ---------- */

  function teken() {
    // Eerst het kind kiezen (de beheerder ziet ook de antwoorden zonder kind).
    const kinderen = info.kinderen.map((k) => ({ ...k, n: alles.filter((g) => g.kind === k.id && g.soort === 'antwoord').length }));
    const los = alles.filter((g) => !g.kind && g.soort === 'antwoord').length;
    if (info.rol === 'beheer' && los) kinderen.push({ id: LOS, naam: 'Zonder kind', n: los });
    if (!kinderen.some((k) => k.id === kindId)) {
      const meeste = kinderen.slice().sort((a, b) => b.n - a.n)[0];
      kindId = meeste ? meeste.id : null;
    }
    $('#kinderen').innerHTML = kinderen.length
      ? kinderen.map((k) => `<button type="button" class="tab" data-kind-id="${esc(k.id)}" aria-pressed="${k.id === kindId}">${esc(k.naam)} <small>${k.n}</small></button>`).join('')
      : '<p class="sub">Er staan nog geen kinderen bij dit gezin.</p>';

    const vanDitKind = alles.filter((g) => (kindId === LOS ? !g.kind : g.kind === kindId));
    const telling = Object.fromEntries(FIGUREN.map((f) => [f.id, vanDitKind.filter((g) => g.wie === f.id && g.soort === 'antwoord').length]));
    if (!telling[figuur]) {
      const beste = FIGUREN.slice().sort((a, b) => telling[b.id] - telling[a.id])[0];
      if (telling[beste.id]) figuur = beste.id;
    }
    $('#tabs').innerHTML = FIGUREN.filter((f) => telling[f.id] || f.id === figuur).map((k) =>
      `<button type="button" class="tab" data-figuur="${k.id}" aria-pressed="${k.id === figuur}">${k.naam} <small>${esc(k.uitleg)} · ${telling[k.id]}</small></button>`).join('');

    const vanKind = binnenPeriode(vanDitKind.filter((g) => g.wie === figuur));
    const antwoorden = vanKind.filter((g) => g.soort === 'antwoord');
    const goed = antwoorden.filter((g) => g.punten >= 1).length;
    const fout = antwoorden.filter((g) => g.punten < 1).length;
    const dagen = new Set(vanKind.map((g) => dagSleutel(g.t)));

    $('#cijfers').innerHTML = [
      [antwoorden.length ? `${pct(punten(antwoorden), antwoorden.length)}%` : '–', 'goed (punten)'],
      [`<span class="goed">${goed}</span> / <span class="fout">${fout}</span>`, 'goed / niet goed'],
      [`${minuten(vanKind)} min`, 'geschatte oefentijd'],
      [dagen.size, dagen.size === 1 ? 'dag geoefend' : 'dagen geoefend']
    ].map(([b, s]) => `<div class="cijfer"><b>${b}</b><span>${s}</span></div>`).join('');

    tekenRooster(vanKind);
    tekenOnderdelen(antwoorden);
    tekenDagen(vanKind);
    tekenFouten(antwoorden);
  }

  // Alleen voor Mochi: het rooster van twee weken, met per dag de uitslag.
  function tekenRooster(lijst) {
    const doel = $('#rooster');
    if (figuur !== 'mochi') { doel.innerHTML = ''; return; }
    const klaar = new Map();
    lijst.filter((g) => g.soort === 'klaar' && g.dag !== undefined).forEach((g) => klaar.set(`${g.dag}:${g.onderdeel}`, g));
    const start = new Date(`${MOCHI.begin}T12:00:00`);
    const vandaag = dagSleutel(new Date().toISOString());
    const rijen = [];
    for (let d = 0; d < MOCHI.dagen; d++) {
      const datum = new Date(start); datum.setDate(start.getDate() + d);
      const sleutel = dagSleutel(datum.toISOString());
      const cellen = MOCHI.onderdelen.map((o) => {
        const k = klaar.get(`${d}:${o.id}`);
        if (!k) return '<td class="cel leeg">·</td>';
        if (k.totaal) {
          const p = pct(k.score, k.totaal);
          return `<td class="cel ${niveau(p)}" title="${esc(k.resultaat)}">${getal(k.score)}/${k.totaal}</td>`;
        }
        // Woordrij en hardop lezen: geen goed/fout, maar een tempo.
        const kort = String(k.resultaat || '✓').replace(' woorden per minuut', ' wpm').replace(' woorden', ' w').split(' · ')[0];
        return `<td class="cel info" title="${esc(k.resultaat)}">${esc(kort)}</td>`;
      }).join('');
      rijen.push(`<tr class="${sleutel === vandaag ? 'vandaag' : ''}"><td>${d + 1}. ${dagNaam(sleutel)}${sleutel === vandaag ? ' 👈' : ''}</td>${cellen}</tr>`);
    }
    doel.innerHTML = `<div class="kaart"><h2>Rooster van twee weken</h2>
      <p class="sub" style="margin-top:-.4rem">Groen ≥ 80% · oranje ≥ 55% · rood daaronder. Woordrij: aantal woorden in één minuut (w) · hardop lezen: woorden per minuut (wpm).</p>
      <div class="rooster-wrap"><table class="rooster"><thead><tr><th>Dag</th>${MOCHI.onderdelen.map((o) =>
        `<th class="kop" title="${esc(o.titel)} · ${esc(o.toets)}">${o.emoji}<span class="kop-woord"><br>${esc(o.titel.split(' ')[0])}</span></th>`).join('')}</tr></thead>
      <tbody>${rijen.join('')}</tbody></table></div></div>`;
  }

  function tekenOnderdelen(antwoorden) {
    const groepen = new Map();
    antwoorden.forEach((g) => {
      if (!groepen.has(g.onderdeel)) groepen.set(g.onderdeel, []);
      groepen.get(g.onderdeel).push(g);
    });
    if (!groepen.size) { $('#onderdelen').innerHTML = '<p class="leeg-bericht">Nog geen antwoorden in deze periode.</p>'; return; }
    const volgorde = Object.keys(ONDERDEEL_NAAM[figuur] || {});
    $('#onderdelen').innerHTML = [...groepen.entries()]
      .sort((a, b) => volgorde.indexOf(a[0]) - volgorde.indexOf(b[0]))
      .map(([id, lijst]) => {
        const p = pct(punten(lijst), lijst.length);
        const goed = lijst.filter((g) => g.punten >= 1).length;
        return `<div class="staaf"><span>${esc(naamVan(figuur, id))}</span>
          <span class="spoor"><span class="vul ${niveau(p)}" style="width:${p}%"></span></span>
          <span class="getal">${p}% · ${goed}/${lijst.length}</span></div>`;
      }).join('');
  }

  function tekenDagen(lijst) {
    const per = new Map();
    lijst.forEach((g) => {
      const d = dagSleutel(g.t);
      if (!per.has(d)) per.set(d, []);
      per.get(d).push(g);
    });
    if (!per.size) { $('#dagen').innerHTML = '<p class="leeg-bericht">Nog niets geoefend in deze periode.</p>'; return; }
    const rijen = [...per.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([d, l]) => {
      const a = l.filter((g) => g.soort === 'antwoord');
      const onderdelen = [...new Set(a.map((g) => naamVan(figuur, g.onderdeel)))].join(', ');
      const p = pct(punten(a), a.length);
      return `<tr><td>${dagNaam(d)}</td><td>${a.length}</td>
        <td class="${a.length ? (p >= 80 ? 'goed' : p < 55 ? 'fout' : '') : ''}">${a.length ? `${p}%` : '–'}</td>
        <td>${minuten(l)} min</td><td>${esc(onderdelen)}</td></tr>`;
    });
    $('#dagen').innerHTML = `<div class="rooster-wrap"><table><thead><tr><th>Dag</th><th>Vragen</th><th>Goed</th><th>Tijd</th><th>Onderdelen</th></tr></thead>
      <tbody>${rijen.join('')}</tbody></table></div>`;
  }

  function tekenFouten(antwoorden) {
    const filter = $('#fout-filter');
    const gekozen = filter.value;
    const ids = [...new Set(antwoorden.filter((g) => g.punten < 1).map((g) => g.onderdeel))];
    filter.innerHTML = `<option value="">Alle onderdelen</option>${ids.map((id) =>
      `<option value="${esc(id)}" ${id === gekozen ? 'selected' : ''}>${esc(naamVan(figuur, id))}</option>`).join('')}`;

    const fouten = antwoorden.filter((g) => g.punten < 1 && (!filter.value || g.onderdeel === filter.value)).reverse();
    if (!fouten.length) {
      $('#fouten').innerHTML = `<li class="leeg-bericht">${antwoorden.length ? 'Alles goed in deze periode! 🎉' : 'Nog geen antwoorden.'}</li>`;
      $('#meer').hidden = true;
      return;
    }
    $('#fouten').innerHTML = fouten.slice(0, foutenGetoond).map((g) => `
      <li>
        <div class="wat">${esc(naamVan(figuur, g.onderdeel))} · ${esc(g.titel)}${g.dag !== undefined ? ` · dag ${g.dag + 1}` : ''} · ${tijd(g.t)}${g.punten > 0 ? ' · half goed' : ''}</div>
        <div class="vraag">${esc(g.vraag)}</div>
        <div class="paar">
          <span>Antwoord: <s class="fout">${esc(g.antwoord || '(leeg)')}</s></span>
          <span>Goed: <b class="goed">${esc(g.juist)}</b></span>
        </div>
      </li>`).join('');
    $('#meer').hidden = fouten.length <= foutenGetoond;
  }

  /* ---------- Knoppen ---------- */

  $('#inlog-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const gebruikersnaam = $('#gebruiker').value.trim();
    const wachtwoord = $('#wachtwoord').value;
    if (!gebruikersnaam || !wachtwoord) return;
    try {
      const { token } = await vraag('/api/login', { method: 'POST', body: JSON.stringify({ gebruikersnaam, wachtwoord }) });
      schrijf(TOKEN, token);
      $('#wachtwoord').value = '';
      laad();
    } catch (fout) {
      $('#melding').textContent = fout.message;
    }
  });
  $('#kinderen').addEventListener('click', (e) => {
    const knop = e.target.closest('[data-kind-id]');
    if (!knop) return;
    kindId = knop.dataset.kindId;
    schrijf(KIND_ID, kindId);
    foutenGetoond = 25;
    $('#fout-filter').value = '';
    teken();
  });
  $('#tabs').addEventListener('click', (e) => {
    const knop = e.target.closest('[data-figuur]');
    if (!knop) return;
    figuur = knop.dataset.figuur;
    schrijf(KIND, figuur);
    foutenGetoond = 25;
    $('#fout-filter').value = '';
    teken();
  });
  $('#periode').addEventListener('change', teken);
  $('#fout-filter').addEventListener('change', () => { foutenGetoond = 25; teken(); });
  $('#meer').addEventListener('click', () => { foutenGetoond += 50; teken(); });
  $('#ververs').addEventListener('click', laad);
  $('#uitloggen').addEventListener('click', () => { schrijf(TOKEN, null); alles = []; $('#beheer').hidden = true; toonInlog(); });

  /* ---------- Beheer (alleen de beheerder) ---------- */

  let beheerData = { gezinnen: [], los: [] };

  async function laadBeheer() {
    try { beheerData = await vraag('/api/beheer'); tekenBeheer(); } catch (e) { $('#beheer-melding').textContent = e.message; }
  }

  async function actie(gegevens) {
    $('#beheer-melding').textContent = '';
    try {
      const data = await vraag('/api/beheer', { method: 'POST', body: JSON.stringify(gegevens) });
      beheerData = data;
      tekenBeheer();
      return data;
    } catch (e) {
      $('#beheer-melding').textContent = e.message;
      return null;
    }
  }

  function toonUitkomst(html) {
    const vak = $('#beheer-uitkomst');
    vak.innerHTML = html;
    vak.hidden = !html;
  }

  const FIGUUR_NAAM = Object.fromEntries(FIGUREN.map((f) => [f.id, f.naam]));
  const datum = (t) => new Date(t).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });

  function tekenBeheer() {
    $('#beheer').hidden = false;
    const { gezinnen, los } = beheerData;
    $('#gezinnen').innerHTML = gezinnen.length ? gezinnen.map((g) => `
      <div class="gezin" data-gezin="${esc(g.id)}">
        <div class="regel"><b>${esc(g.naam)}</b><span class="sub">gebruiker <code>${esc(g.gebruikersnaam)}</code></span><span class="sub">koppelcode <code>${esc(g.code)}</code></span></div>
        <div class="regel">${g.kinderen.map((k) => `<span class="chip">${esc(k.naam)}<button type="button" data-actie="kind-weg" data-kind="${esc(k.id)}" aria-label="${esc(k.naam)} weghalen" title="Weghalen">×</button></span>`).join('')}
          <form class="kind-form"><input name="naam" placeholder="Kind erbij" aria-label="Naam van kind" size="10"><button class="klein-knop" type="submit">+</button></form></div>
        <div class="regel">
          <button type="button" class="klein-knop" data-actie="wachtwoord-nieuw">Nieuw wachtwoord</button>
          <button type="button" class="klein-knop" data-actie="code-nieuw">Nieuwe koppelcode</button>
          <button type="button" class="klein-knop gevaar" data-actie="gezin-weg">Gezin verwijderen</button>
        </div>
      </div>`).join('') : '<p class="sub">Nog geen gezinnen. Maak hierboven het eerste aan, bijvoorbeeld je eigen gezin.</p>';

    const alleKinderen = gezinnen.flatMap((g) => g.kinderen.map((k) => ({ id: k.id, naam: `${k.naam} (${g.naam})` })));
    $('#los').innerHTML = los.length ? `<div class="rooster-wrap"><table><thead><tr><th>Tablet</th><th>Figuur</th><th>Vragen</th><th>Periode</th><th>Hoort bij</th></tr></thead><tbody>
      ${los.map((r) => `<tr><td><code>…${esc(String(r.apparaat || '?').slice(-6))}</code></td><td>${esc(FIGUUR_NAAM[r.wie] || r.wie)}</td><td>${r.aantal}</td>
        <td>${datum(r.eerste)} – ${datum(r.laatste)}</td>
        <td><select data-apparaat="${esc(r.apparaat)}" data-wie="${esc(r.wie)}" aria-label="Kind kiezen">
          <option value="">— niemand —</option>${alleKinderen.map((k) => `<option value="${esc(k.id)}" ${k.id === r.kind ? 'selected' : ''}>${esc(k.naam)}</option>`).join('')}
        </select></td></tr>`).join('')}</tbody></table></div>` : '<p class="sub">Alle antwoorden horen bij een kind.</p>';
  }

  $('#gezin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const data = await actie({
      actie: 'gezin-nieuw', naam: f.naam.value, gebruikersnaam: f.gebruikersnaam.value,
      kinderen: f.kinderen.value.split(',').map((k) => k.trim()).filter(Boolean)
    });
    if (!data) return;
    f.reset();
    toonUitkomst(`Geef dit aan de ouder (het wachtwoord zie je maar één keer):<br>
      Inloggen op <b>${esc(location.origin)}/ouders</b> met gebruikersnaam <code>${esc(data.gezinnen.find((g) => g.id === data.gezin).gebruikersnaam)}</code>
      en wachtwoord <code>${esc(data.wachtwoord)}</code>.<br>Koppelcode voor de tablet: <code>${esc(data.code)}</code>`);
    laad();
  });

  $('#gezinnen').addEventListener('submit', async (e) => {
    e.preventDefault();
    const gezin = e.target.closest('[data-gezin]').dataset.gezin;
    const naam = e.target.naam.value.trim();
    if (naam && await actie({ actie: 'kind-nieuw', gezin, naam })) laad();
  });

  $('#gezinnen').addEventListener('click', async (e) => {
    const knop = e.target.closest('[data-actie]');
    if (!knop) return;
    const blok = knop.closest('[data-gezin]');
    const gezin = blok.dataset.gezin;
    const naam = blok.querySelector('b').textContent;
    const soort = knop.dataset.actie;
    if (soort === 'gezin-weg' && !confirm(`Gezin ${naam} verwijderen? De ouder kan dan niet meer inloggen. De antwoorden blijven bewaard.`)) return;
    if (soort === 'kind-weg' && !confirm('Dit kind weghalen? De antwoorden blijven bewaard, maar niemand ziet ze nog.')) return;
    if (soort === 'code-nieuw' && !confirm('Nieuwe koppelcode maken? Tablets met de oude code moeten opnieuw koppelen.')) return;
    if (soort === 'wachtwoord-nieuw' && !confirm(`Nieuw wachtwoord voor ${naam}? Het oude werkt dan niet meer.`)) return;
    const data = await actie({ actie: soort, gezin, kind: knop.dataset.kind });
    if (!data) return;
    if (data.wachtwoord) toonUitkomst(`Nieuw wachtwoord voor ${esc(naam)}: <code>${esc(data.wachtwoord)}</code>`);
    else if (data.code) toonUitkomst(`Nieuwe koppelcode voor ${esc(naam)}: <code>${esc(data.code)}</code>`);
    else toonUitkomst('');
    laad();
  });

  $('#los').addEventListener('change', async (e) => {
    const s = e.target.closest('select[data-apparaat]');
    if (!s) return;
    if (await actie({ actie: 'toewijzen', apparaat: s.dataset.apparaat, wie: s.dataset.wie, kind: s.value || null })) laad();
  });
  setInterval(() => { if (!$('#overzicht').hidden && document.visibilityState === 'visible') laad(); }, 60000);

  laad();
})();
</script>
</body>
</html>
